services:
  - type: web
    name: devops-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/client
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: devops-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npx tsc
    startCommand: node dist/server.js
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devops-db
          property: connectionString

databases:
  - name: devops-db
    engine: postgres
    plan: free
