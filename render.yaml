services:
  - type: web
    name: devops-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/client
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: devops-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"

databases:
  - name: devops-db
    engine: postgres
    plan: free
