services:
  - type: web
    name: devops-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/client
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: devops-backend
          property: url

  - type: web
    name: devops-backend
    env: node
    plan: standard
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          name: devops-frontend
          property: url

databases:
  - name: devops-db
    databaseName: devops_db
    user: devops_user
    plan: standard
